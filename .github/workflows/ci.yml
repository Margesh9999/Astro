name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini-services/astro-backend
    env:
      ASTRO_DEMO_DATA: "1"   # synthetic prices: tests never depend on Yahoo / Stooq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-services/astro-backend/requirements*.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: npx eslint src/components/astro/panchang-card.tsx src/lib/astro/api-panchang.ts
      - run: npx next build
