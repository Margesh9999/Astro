name: Live smoke test
# Probes the public Vercel production deployments (web + API). Informational: it checks
# what is live right now, which may lag this commit until it is deployed.
on:
  push:
    branches: [main, "feat/**"]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      API: https://astrotrader-api.vercel.app
      WEB: https://astrotrader-ten.vercel.app
    steps:
      - name: API
        run: |
          set -x
          sleep 150  # let a just-pushed production build settle
          curl -sS -m 120 -w '\n[HTTP %{http_code}]\n' "$API/api/v1/health" || true
          curl -sS -m 120 --retry 3 --retry-delay 15 --retry-all-errors -f "$API/api/v1/health"
          curl -sS -m 120 --retry 2 -f "$API/api/v1/panchang" | head -c 1500; echo
          curl -sS -m 120 --retry 2 -f "$API/api/v1/panchang/calendar?days=7" | head -c 400; echo
          curl -sS -m 120 --retry 2 -f "$API/api/v1/planetary/$(date -u +%F)?vedic=true" | head -c 400; echo
          curl -sS -m 120 -w '\n[HTTP %{http_code}]\n' "$API/api/v1/market/%5EGSPC" | head -c 800; echo
      - name: Web
        run: |
          set -x
          curl -sS -m 120 --retry 3 --retry-delay 15 --retry-all-errors -f "$WEB/" | grep -o "<title>[^<]*</title>"
          curl -sS -m 120 --retry 2 -f "$WEB/api/astro/health"
          curl -sS -m 180 -w '\n[HTTP %{http_code}]\n' "$WEB/api/astro/panchang?symbol=%5EGSPC" | head -c 3000; echo
          curl -sS -m 180 -w '\n[HTTP %{http_code}]\n' "$WEB/api/astro/cycles/clock" | head -c 600; echo
