<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AstroTrader">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#fff6df"/>
      <stop offset="1" stop-color="#f6d79c"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8a04c"/>
      <stop offset="1" stop-color="#a8701a"/>
    </linearGradient>
  </defs>
  <!-- rashi wheel: 12 signs -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="url(#gold)" stroke-width="2.5"/>
  <g stroke="#c98a2e" stroke-width="1.6" stroke-linecap="round">
    <line x1="32" y1="3.5" x2="32" y2="7.5"/><line x1="32" y1="56.5" x2="32" y2="60.5"/>
    <line x1="3.5" y1="32" x2="7.5" y2="32"/><line x1="56.5" y1="32" x2="60.5" y2="32"/>
    <line x1="46.3" y1="7.3" x2="44.3" y2="10.7"/><line x1="17.7" y1="7.3" x2="19.7" y2="10.7"/>
    <line x1="46.3" y1="56.7" x2="44.3" y2="53.3"/><line x1="17.7" y1="56.7" x2="19.7" y2="53.3"/>
    <line x1="7.3" y1="17.7" x2="10.7" y2="19.7"/><line x1="56.7" y1="17.7" x2="53.3" y2="19.7"/>
    <line x1="7.3" y1="46.3" x2="10.7" y2="44.3"/><line x1="56.7" y1="46.3" x2="53.3" y2="44.3"/>
  </g>
  <!-- North Indian kundali -->
  <g fill="none" stroke="#8a4a1e" stroke-width="1.8" stroke-linejoin="round">
    <rect x="16" y="16" width="32" height="32" rx="1.5"/>
    <path d="M16 16 L48 48 M48 16 L16 48"/>
    <path d="M32 16 L48 32 L32 48 L16 32 Z"/>
  </g>
  <!-- Surya bindu with a rising market line -->
  <circle cx="32" cy="32" r="4.2" fill="url(#gold)" stroke="#fff6df" stroke-width="1"/>
  <path d="M19 43 L26 37 L31 39.5 L38 31 L45 25" fill="none" stroke="#c9553f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M41 24.6 L45.4 24.6 L45.4 29" fill="none" stroke="#c9553f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
